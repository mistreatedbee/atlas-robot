# Project Atlas settings. Paths are relative to this file.
# This configuration contains NO credentials and none are needed for the research phases.

instruments_file = "config/instruments.toml"

# Project scope (2026-10-11): the ONLY instrument Atlas may research for trading, or ever trade, is XAU/USD.
# Loading fails if any enabled registry instrument is outside this list.
[scope]
authorised_instruments = ["XAUUSD"]

[storage]
database_path = "data/atlas.db"
log_path = "logs/atlas.jsonl"

# SYNTHETIC sample data generated by scripts/generate_sample_data.py. NOT market prices.
# Exists so the gold pipeline can be exercised before the broker's data is available.
[providers.sample_synthetic]
kind = "csv_file"
venue = "synthetic"
path = "data/sample/{symbol}_{timeframe}.csv"
data_label = "synthetic_sample"
price_basis = "bid"
volume_kind = "synthetic"
source_timezone = "UTC"

# Files you export yourself from the chosen broker (e.g. MT5). Rename `venue` to the broker and set
# `source_timezone` to the broker's server time zone once verified (MT5 servers are often UTC+2/UTC+3).
[providers.user_csv]
kind = "csv_file"
venue = "user_supplied"
path = "data/imports/{symbol}_{timeframe}.csv"
data_label = "user_file"
price_basis = "bid"
volume_kind = "tick_count"
source_timezone = "UTC"

# Note: atlas/providers/binance_spot.py (verified 2026-10-11) is retained as a dormant reference
# implementation of the provider interface. Crypto is out of scope, so it is deliberately not configured.

# Vault Markets MT5 exports (View -> Symbols -> Bars -> Export), placed in data/imports/vault_markets/
# and named XAUUSD_M1_bars_<from>_<to>.csv (docs/10). Not yet received.
# server_time_model is PROVISIONAL (a common MT5 convention, not confirmed by Vault). Every export is checked
# against the Friday close AND Sunday reopen of each weekend; the import is REFUSED on any contradiction.
# friday_close_ny / sunday_open_ny: broker's gold session boundaries (New York time); defaults are the CME
# convention and are PROVISIONAL until read from the MT5 Specification "Trades" sessions.
# server_time_evidence: set only when independent evidence exists (support reply, server-clock screenshot);
# without it imports are labelled "consistent_unconfirmed", never "verified".
[providers.vault_mt5]
kind = "mt5_export"
venue = "vault_markets"
directory = "data/imports/vault_markets"
server_time_model = "ny_close_midnight"
friday_close_ny = "17:00"
sunday_open_ny = "18:00"
# server_time_evidence = ""
data_label = "user_file"
price_basis = "bid"
